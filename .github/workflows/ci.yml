name: Meta-Axiom CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Lean + mathlib Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build Lean Project
        run: |
          # プロジェクト内の lean-toolchain (v4.19.0) を自動で読み込んでビルドします
          elan --version
          lean --version

          # 依存関係の更新と Mathlib のキャッシュ取得
          lake update
          lake exe cache get

          # ビルド実行
          lake build
