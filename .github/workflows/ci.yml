name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-lean:
    name: Lean 4 Formal Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (toolchain pinned by lean-toolchain)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -sSf | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake build & dependencies
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: |
            lake-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}-

      - name: Fetch Mathlib precompiled cache
        run: lake exe cache get

      - name: Compile verified Lean files & check no sorry/admit
        run: bash scripts/verify_lean.sh

  verify-cpp:
    name: C++ Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run UHA demo
        run: |
          g++ -O2 -std=c++20 -o /tmp/UHA_demo UHA_demo.cpp
          timeout 120 /tmp/UHA_demo

      - name: Syntax-check verified C++ files
        run: |
          fail=0
          while IFS= read -r f; do
            case "$f" in ''|\#*) continue ;; esac
            if g++ -fsyntax-only -std=c++20 "$f"; then
              echo "PASS $f"
            else
              echo "::error::FAIL $f"
              fail=1
            fi
          done < ci/verified_cpp.txt
          total=$(ls -1 *.cpp | wc -l)
          count=$(grep -vc -e '^\s*#' -e '^\s*$' ci/verified_cpp.txt)
          echo "coverage: ${count} / ${total} C++ files are syntax-verified"
          exit "$fail"

  verify-python:
    name: Python Logic Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run integration tests
        run: python verify_42.py

  all-verified:
    name: All Verified
    needs: [verify-lean, verify-cpp, verify-python]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.verify-lean.result }}" != "success" || \
                "${{ needs.verify-cpp.result }}" != "success" || \
                "${{ needs.verify-python.result }}" != "success" ]]; then
            echo "::error::One or more verification jobs failed"
            exit 1
          fi
          echo "Lean 4 + C++ + Python verification passed successfully."

